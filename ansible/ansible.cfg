[defaults]
# ============================================================
# Ansible — VM Lifecycle Toolkit
# ============================================================

# Default inventory (Proxmox clones)
inventory = inventories/proxmox/hosts.yml

# Don't bother the user about new host keys (we're building ephemeral VMs)
host_key_checking = False

# No .retry files cluttering the repo
retry_files_enabled = False

# Human-readable output (YAML-formatted via the built-in default callback, not the
# deprecated community.general.yaml plugin)
stdout_callback = default
callback_result_format = yaml

# Silently auto-discover the Python interpreter on target hosts (default is "auto",
# which prints a warning every time; "auto_silent" has the same behavior minus the noise)
interpreter_python = auto_silent

# Collections installed via requirements.yml go here (self-contained, no system install needed)
collections_path = ./collections

# Roles live at ./roles/ (relative to the directory where ansible-playbook is run — i.e. ansible/).
# Without this, Ansible would only look in <playbook_dir>/roles/, which would miss our role when
# running playbooks from the playbooks/ sub-directory.
roles_path = ./roles

# Log all playbook runs locally
log_path = ./ansible.log

# Parallelism (adjust if you have very wide inventories)
forks = 10

[inventory]
# Enable the dynamic inventory plugins used by inventories/*/{proxmox,esxi}.yml
# alongside the standard static YAML inventory. The order below matters only in
# ambiguous auto-detection cases; each dynamic file carries its explicit plugin.
enable_plugins = community.proxmox.proxmox, community.vmware.vmware_vm_inventory, auto, yaml, ini, host_list, script, toml

# Honor host_vars/group_vars layout for merged dynamic + static inventories
cache = True
cache_plugin = jsonfile
cache_connection = ./.inventory-cache
cache_timeout = 300

[ssh_connection]
# Faster SSH via multiplexing + pipelining
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
