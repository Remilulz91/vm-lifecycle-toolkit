---
# ============================================================
# Static inventory — VMs to deploy to standalone ESXi
# ============================================================
#
# Each entry under esxi_clones.hosts (or esxi_windows_clones.hosts)
# describes ONE VM that will be deployed from a local OVF/OVA
# bundle to the ESXi host defined in group_vars/all.yml.
#
# Required per host:
#   source_ovf_dir  : subfolder under esxi_deploy_ovf_base_dir
#   source_ovf_file : OVF/OVA file name inside source_ovf_dir
#   target_name     : name shown in the ESXi UI for the new VM
#
# Optional per host:
#   target_cores     : override CPU core count
#   target_memory_mb : override RAM in MiB
#   target_ip        : expected IP after boot. If set, the deploy
#                      playbook waits for SSH on port 22, and the
#                      configure-vm.yml playbook uses it as ansible_host.
#
# Specialization groups (same semantics as the Proxmox inventory):
#   docker_hosts, webservers — apply the matching roles over SSH
#
# Usage:
#   # Step 1 — deploy from OVF:
#   ansible-playbook -i inventories/esxi/ playbooks/deploy-from-ovf.yml
#
#   # Step 2 — baseline + specialization:
#   export ADMIN_SSH_PUBLIC_KEY="$(cat ~/.ssh/id_ed25519.pub)"
#   ansible-playbook -i inventories/esxi/ playbooks/configure-vm.yml
# ============================================================

all:
  children:
    # ============================================================
    # Linux VMs on ESXi — get base_config over SSH after deploy.
    # ============================================================
    esxi_clones:
      hosts:
        # ---------- Example 1: Debian 13 on ESXi ----------
        debian-esxi-01:
          source_ovf_dir: "debian-13"
          source_ovf_file: "debian-13.ovf"
          target_name: "debian-esxi-01"
          target_cores: 2
          target_memory_mb: 4096
          # target_ip: "192.168.1.231"

        # ---------- Example 2 (commented): Ubuntu Server ----------
        # ubuntu-esxi-01:
        #   source_ovf_dir: "ubuntu-24-04-server"
        #   source_ovf_file: "ubuntu-24-04-server.ovf"
        #   target_name: "ubuntu-esxi-01"
        #   target_cores: 4
        #   target_memory_mb: 8192
        #   target_ip: "192.168.1.232"

    # ============================================================
    # Windows VMs on ESXi — get base_config_windows (SSH + PowerShell)
    # ============================================================
    esxi_windows_clones:
      hosts:
        # ---------- Example: Windows 11 on ESXi ----------
        # windows-esxi-01:
        #   source_ovf_dir: "windows-11"
        #   source_ovf_file: "windows-11.ova"
        #   target_name: "windows-esxi-01"      # <= 15 chars (NetBIOS)
        #   target_cores: 4
        #   target_memory_mb: 8192
        #   target_ip: "192.168.1.235"

    # ============================================================
    # Specialization groups (shared semantics with the Proxmox inventory).
    # ============================================================
    docker_hosts:
      hosts:
        # debian-esxi-01:

    webservers:
      hosts:
        # ubuntu-esxi-01:
