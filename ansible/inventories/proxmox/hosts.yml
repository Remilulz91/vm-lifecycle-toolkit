---
# ============================================================
# Static inventory — VMs to clone from Packer-built templates
# ============================================================
#
# Each entry under proxmox_clones.hosts describes ONE VM that
# will be cloned from a Packer-built template.
#
# Required per host:
#   source_template_vmid : VMID of the Packer template to clone from
#   target_vmid          : VMID for the new clone (must be free + >= 1000)
#   target_name          : Name shown in Proxmox UI
#
# Optional per host:
#   target_cores         : Override CPU core count (otherwise inherit from template)
#   target_memory_mb     : Override RAM in MiB
#   target_ip            : Expected IP of the cloned VM.
#                          - For clone-from-template.yml: if set, Ansible
#                            waits for SSH on port 22 after start.
#                          - For configure-vm.yml: REQUIRED (used as
#                            ansible_host over SSH).
#
# To clone VMs:
#   ansible-playbook playbooks/clone-from-template.yml
#
# To clone a specific one only:
#   ansible-playbook playbooks/clone-from-template.yml --limit debian-example-01
# ============================================================

all:
  children:
    proxmox_clones:
      hosts:
        # ---------- Example 1 : clone a Debian 13 VM ----------
        debian-example-01:
          source_template_vmid: 1001          # VMID of the Packer-built Debian 13 template
          target_vmid: 2001                   # VMID for the new clone
          target_name: "debian-example-01"
          target_cores: 2                     # Optional hardware override
          target_memory_mb: 4096
          # target_ip: "192.168.1.201"        # Uncomment to wait for SSH on this IP

        # ---------- Example 2 (commented): Ubuntu Server clone ----------
        # ubuntu-example-01:
        #   source_template_vmid: 1002        # VMID of the Packer-built Ubuntu Server template
        #   target_vmid: 2002
        #   target_name: "ubuntu-example-01"
        #   target_cores: 4
        #   target_memory_mb: 8192
        #   target_ip: "192.168.1.202"
