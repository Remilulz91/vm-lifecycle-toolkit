---
# ============================================================
# Static inventory — VMs to clone + configure
# ============================================================
#
# Each entry under proxmox_clones.hosts describes ONE VM that
# will be cloned from a Packer-built template (clone-from-template.yml)
# and then configured over SSH (configure-vm.yml).
#
# Required per host:
#   source_template_vmid : VMID of the Packer template to clone from
#   target_vmid          : VMID for the new clone (must be free + >= 1000)
#   target_name          : Name shown in Proxmox UI
#
# Optional per host:
#   target_cores         : Override CPU core count (otherwise inherit from template)
#   target_memory_mb     : Override RAM in MiB
#   target_ip            : Expected IP of the cloned VM.
#                          - For clone-from-template.yml: if set, Ansible
#                            waits for SSH on port 22 after start.
#                          - For configure-vm.yml: REQUIRED (used as
#                            ansible_host over SSH).
#
# Specialization groups (V3.7.3+):
#   docker_hosts : members get Docker CE + Compose plugin installed
#   webservers   : members get nginx + a demo vhost on :80
# Add a host to a specialization group IN ADDITION to proxmox_clones.
#
# Usage:
#   # Step 1 — clone + start:
#   ansible-playbook playbooks/clone-from-template.yml
#
#   # Step 2 — baseline + specialization:
#   export ADMIN_SSH_PUBLIC_KEY="$(cat ~/.ssh/id_ed25519.pub)"
#   ansible-playbook playbooks/configure-vm.yml
# ============================================================

all:
  children:
    # ============================================================
    # All cloned VMs — must contain every host for the toolkit to
    # know where to clone from, where to SSH to, and what baseline
    # to apply.
    # ============================================================
    proxmox_clones:
      hosts:
        # ---------- Example 1: plain Debian 13 VM ----------
        debian-example-01:
          source_template_vmid: 1001          # VMID of the Packer-built Debian 13 template
          target_vmid: 2001                   # VMID for the new clone
          target_name: "debian-example-01"
          target_cores: 2                     # Optional hardware override
          target_memory_mb: 4096
          # target_ip: "192.168.1.201"        # Uncomment to wait for SSH / enable configure-vm.yml

        # ---------- Example 2: Docker host ----------
        # docker-host-01:
        #   source_template_vmid: 1001        # Debian 13 template
        #   target_vmid: 2010
        #   target_name: "docker-host-01"
        #   target_cores: 4
        #   target_memory_mb: 8192
        #   target_ip: "192.168.1.210"

        # ---------- Example 3: nginx web server ----------
        # web-01:
        #   source_template_vmid: 1002        # Ubuntu Server template
        #   target_vmid: 2020
        #   target_name: "web-01"
        #   target_cores: 2
        #   target_memory_mb: 4096
        #   target_ip: "192.168.1.220"

    # ============================================================
    # Specialization groups (V3.7.3+)
    # List the hostnames that should receive each specialized role.
    # Each host MUST also appear under proxmox_clones above.
    # ============================================================
    docker_hosts:
      hosts:
        # docker-host-01:

    webservers:
      hosts:
        # web-01:
