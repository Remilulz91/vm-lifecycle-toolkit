---
# ============================================================
# Post-clone configuration for Packer-built VMs
# ============================================================
#
# Prerequisite: the VM has been cloned & started with
#   ansible-playbook playbooks/clone-from-template.yml
# and is reachable over SSH on its target_ip (defined in
# inventories/proxmox/hosts.yml for each VM).
#
# This playbook connects to the VM over SSH, as the user that
# Packer created in the template (packer_ssh_user, defaults to
# the common 'packer' / distro login), and applies the base_config
# role: hostname, timezone, base packages, single 'admin' user
# with SSH key + passwordless sudo, and SSH hardening.
#
# After this playbook runs successfully, the admin user is the
# intended way to connect — the Packer user can be rotated out
# later (planned for V3.7.5 decommission).
#
# Usage (from the ansible/ directory):
#
#   ansible-playbook playbooks/configure-vm.yml
#   ansible-playbook playbooks/configure-vm.yml --limit debian-example-01
#   ansible-playbook playbooks/configure-vm.yml \
#       -e base_config_apt_upgrade=true
# ============================================================

- name: Baseline post-clone configuration
  hosts: proxmox_clones
  gather_facts: true
  become: false   # individual tasks escalate as needed

  pre_tasks:
    - name: Verify that target_ip is defined for this host
      ansible.builtin.assert:
        that:
          - target_ip is defined
          - target_ip | length > 0
        fail_msg: >-
          target_ip must be set in inventory for host {{ inventory_hostname }}
          — configure-vm.yml connects over SSH and cannot work without it.

  roles:
    - role: base_config
