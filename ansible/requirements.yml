---
# ============================================================
# Ansible Collections — VM Lifecycle Toolkit
# ============================================================
#
# Install with:
#   ansible-galaxy collection install -r requirements.yml
#
# Collections install into ./collections/ (set by ansible.cfg),
# so no system-wide install is needed.
# ============================================================

collections:
  # Dedicated Proxmox collection (spun off from community.general in 2024).
  # Contains proxmox_kvm, proxmox_vm_info, proxmox_node, etc.
  - name: community.proxmox
    version: ">=1.0.0"

  # Still useful for other general-purpose modules we may add later
  # (and the proxmox_* modules remain here too until community.general 15.0.0).
  - name: community.general
    version: ">=8.0.0"

  # Standard POSIX modules (file permissions, synchronize, authorized_key, etc.)
  - name: ansible.posix
    version: ">=1.5.0"

  # Windows modules (win_user, win_hostname, win_timezone, win_reboot,
  # win_copy, win_firewall_rule, etc.) — required by base_config_windows (V3.7.4+).
  - name: ansible.windows
    version: ">=2.0.0"

  # VMware modules — required by esxi_deploy (V3.7.5+).
  # Needs pyvmomi (listed in requirements.txt).
  - name: community.vmware
    version: ">=4.0.0"
