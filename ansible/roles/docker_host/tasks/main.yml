---
# ============================================================
# docker_host — role tasks
# ============================================================
# Installs Docker CE + Compose plugin from Docker's official apt
# repository on Debian / Ubuntu, adds the specified users to the
# 'docker' group, enables and starts the service.
# ============================================================

- name: Fail fast on unsupported distributions
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
    fail_msg: >-
      docker_host only supports Debian and Ubuntu
      (got {{ ansible_facts.distribution }}).

# ---------- Prerequisites ----------
- name: Install prerequisite packages
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure keyring directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# ---------- Docker GPG key + apt repository ----------
- name: Download Docker apt GPG key
  become: true
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Add Docker apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_facts.architecture | regex_replace('^x86_64$', 'amd64') | regex_replace('^aarch64$', 'arm64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts.distribution | lower }}
      {{ ansible_facts.distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

# ---------- Install Docker ----------
- name: Install Docker CE + plugins
  become: true
  ansible.builtin.apt:
    name: "{{ docker_host_packages }}"
    state: present

- name: Enable and start docker service
  become: true
  ansible.builtin.service:
    name: docker
    enabled: "{{ docker_host_service_enabled }}"
    state: "{{ docker_host_service_state }}"

# ---------- User access ----------
- name: Add users to the docker group
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_host_users }}"

# ---------- Smoke test ----------
- name: Verify docker version
  become: true
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Report docker install
  ansible.builtin.debug:
    msg: >-
      docker_host complete on {{ inventory_hostname }}:
      {{ docker_version.stdout }}, users in docker group:
      {{ docker_host_users | join(', ') }}.
