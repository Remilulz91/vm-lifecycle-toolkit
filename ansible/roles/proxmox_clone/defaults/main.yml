---
# ============================================================
# proxmox_clone — role defaults
# ============================================================
#
# These values are the fall-back defaults for this role.
# Override via inventory host_vars, group_vars, or at the
# command line with -e "var=value".
#
# Required inputs (expected from inventory host entries) :
#   source_template_vmid : VMID of the Packer template to clone from
#   target_vmid          : VMID for the new clone (unique + >= 1000)
#   target_name          : Name shown in Proxmox UI
#
# Optional inputs :
#   target_cores         : Override CPU core count (otherwise inherit from template)
#   target_memory_mb     : Override RAM in MiB
#   target_ip            : Expected IP of the cloned VM (if set, Ansible waits
#                          for SSH on port 22 after start)
#
# Shared / infrastructure vars (expected from group_vars/all.yml) :
#   proxmox_api_host, proxmox_api_user, proxmox_api_token_id,
#   proxmox_api_token_secret, proxmox_node, clone_mode,
#   clone_timeout_seconds, ssh_wait_timeout_seconds
# ============================================================

# This role has no "static" defaults of its own — everything comes
# from inventory (per host) or group_vars (shared). The role is
# fully data-driven, which keeps playbooks terse.
